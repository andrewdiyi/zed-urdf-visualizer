[workspace]

[package]
name = "zed-urdf-server"
version = "0.1.0"
edition = "2021"
description = "Companion LSP, Xacro/ROS package server, Remote SSH forwarder, and native floating 3D viewer for Zed URDF Visualizer"

[[bin]]
name = "zed-urdf-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
mime_guess = "2.0"
open = "5.3"
percent-encoding = "2.3"
roxmltree = "0.20"
rust-embed = "8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tower-lsp = "0.20"
url = "2.5"
walkdir = "2.5"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = "0.30"
wry = "0.47"
