id = "urdf-visualizer"
name = "URDF Visualizer"
version = "0.1.2"
schema_version = 1
authors = ["Andrew <andrewdiyi@users.noreply.github.com>"]
description = "Interactive 3D URDF & Xacro robot visualizer, ROS package:// resolver, Remote SSH preview forwarding, and URDF Language Server for Zed."
repository = "https://github.com/andrewdiyi/zed-urdf-visualizer"

[grammars.xml]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-xml"
rev = "5000ae8f22d11fbe93939b05c1e37cf21117162d"
path = "xml"

[language_servers.urdf-lsp]
name = "URDF Visualizer LSP"
languages = ["URDF", "Xacro"]
opt_in_languages = ["XML"]

[language_servers.urdf-lsp.language_ids]
URDF = "urdf"
Xacro = "xacro"
XML = "xml"
